<title>Atelier Photo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop-style editor. Menu bar on top, tool palette left, canvas centre, status bar bottom. */
:root{
  --bg:#e7e9ec; --panel:#f4f5f7; --panel2:#dfe2e6; --line:#b9bec6; --fg:#1d2430; --muted:#5b6574;
  --accent:#1f5fbf; --accent-fg:#fff; --canvas:#9aa1ab; --hover:#d3d8e0; --danger:#b3261e;
  --chk1:#fff; --chk2:#d7d9dd;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1c2027; --panel2:#262b33; --line:#3a414c; --fg:#e4e8ee; --muted:#9aa4b2;
  --accent:#5b9bff; --accent-fg:#0b1220; --canvas:#0e1013; --hover:#2d333d; --danger:#ff8a80;
  --chk1:#3b3f46; --chk2:#2d3036; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --panel2:#262b33; --line:#3a414c; --fg:#e4e8ee; --muted:#9aa4b2;
  --accent:#5b9bff; --accent-fg:#0b1220; --canvas:#0e1013; --hover:#2d333d; --danger:#ff8a80;
  --chk1:#3b3f46; --chk2:#2d3036; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--font);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* menu bar */
#menubar{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);padding-left:6px;flex:none;overflow-x:auto;white-space:nowrap}
#brand{font-weight:600;padding:6px 12px 6px 4px;letter-spacing:.02em}
.menu{position:relative}
.menu>button{background:none;border:0;border-radius:0;padding:7px 10px}
.menu>button:hover,.menu.open>button{background:var(--hover)}
.drop{display:none;position:fixed;z-index:50;min-width:230px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25);padding:3px 0;max-height:80vh;overflow:auto}
.menu.open .drop{display:block}
.drop button{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:5px 14px}
.drop button:hover{background:var(--accent);color:var(--accent-fg)}
.drop button:disabled{opacity:.4;pointer-events:none}
.drop kbd{font:11px var(--mono);color:var(--muted)}
.drop button:hover kbd{color:inherit}
.drop hr{border:0;border-top:1px solid var(--line);margin:3px 0}
#menubar .sp{flex:1}
#menubar .tgl{background:none;border:0;padding:7px 10px}
/* toolbar */
#toolbar{display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;white-space:nowrap}
#toolbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}
#toolbar input[type=range]{width:64px}
#toolbar select{background:var(--panel2);border:1px solid var(--line);padding:3px}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.sw{width:26px;height:22px;padding:0;border:1px solid var(--line);cursor:pointer;background:none}
/* main */
#main{display:flex;flex:1;min-height:0}
#tools{width:104px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px;align-content:start;overflow-y:auto}
#tools button{padding:0;height:32px;display:grid;place-items:center;font:600 11px var(--mono)}
#tools button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#tools .lbl{grid-column:1/3;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
#colors{grid-column:1/3;position:relative;height:50px;margin-top:8px}
#colors input{position:absolute;width:28px;height:28px;padding:0;border:1px solid var(--line);cursor:pointer}
#c1{left:2px;top:2px;z-index:2}#c2{left:20px;top:20px}
#stage{flex:1;min-width:0;background:var(--canvas);overflow:auto;position:relative}
#wrap{position:relative;margin:24px;display:inline-block;line-height:0;
  background:conic-gradient(var(--chk2) 25%,var(--chk1) 0 50%,var(--chk2) 0 75%,var(--chk1) 0) 0 0/16px 16px;box-shadow:0 2px 14px rgba(0,0,0,.35)}
#cv{display:block}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff}
#empty div{background:rgba(0,0,0,.45);padding:22px 28px;border-radius:6px;max-width:420px;line-height:1.5}
#empty b{display:block;font-size:16px;margin-bottom:6px}
#stage.drag{outline:3px dashed var(--accent);outline-offset:-6px}
#status{display:flex;gap:18px;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--muted);flex:none;overflow-x:auto;white-space:nowrap}
/* dialogs */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:100;padding:16px}
#modal.on{display:grid}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:300px;max-width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#dlg h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
#dlg .bd{padding:12px 14px;display:grid;gap:9px}
#dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#dlg .row{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center}
#dlg .row.two{grid-template-columns:120px 1fr}
#dlg .row output{font:12px var(--mono);text-align:right}
#dlg input[type=number],#dlg input[type=text],#dlg select{background:var(--bg);border:1px solid var(--line);padding:4px 6px;width:100%}
#dlg .chk{display:flex;gap:8px;align-items:center}
#dlg canvas{max-width:100%;border:1px solid var(--line);background:conic-gradient(var(--chk2) 25%,var(--chk1) 0 50%,var(--chk2) 0 75%,var(--chk1) 0) 0 0/12px 12px}
#dlg p{margin:0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:4px;z-index:200;display:none}
#textbox{position:absolute;z-index:5;display:none;border:1px dashed var(--accent);background:transparent;outline:none;padding:0;margin:0;line-height:1.1;min-width:40px;white-space:pre;color:#000}
@media (max-width:640px){#tools{width:64px}#wrap{margin:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#pal{grid-column:1/3;display:grid;grid-template-columns:repeat(8,1fr);gap:1px;margin-top:4px}
#pal i{display:block;aspect-ratio:1;border:1px solid rgba(0,0,0,.35);cursor:pointer}
#pal i:hover{outline:2px solid var(--accent);outline-offset:-1px;position:relative}
#palNav{grid-column:1/3;display:flex;gap:3px}#palNav button{flex:1;padding:0;height:20px}
#toolbar input[type=number]{width:62px;background:var(--panel2);border:1px solid var(--line);padding:3px}
#dlg .chk{display:flex;gap:8px;align-items:center}
</style>

<div id="app">
  <div id="menubar" role="menubar">
    <span id="brand">Atelier Photo</span>
    <div class="menu" data-m="file"><button>Fichier</button><div class="drop"></div></div>
    <div class="menu" data-m="edit"><button>Édition</button><div class="drop"></div></div>
    <div class="menu" data-m="img"><button>Image</button><div class="drop"></div></div>
    <div class="menu" data-m="adj"><button>Réglage</button><div class="drop"></div></div>
    <div class="menu" data-m="filt"><button>Filtre</button><div class="drop"></div></div>
    <div class="menu" data-m="sel"><button>Sélection</button><div class="drop"></div></div>
    <div class="menu" data-m="tools"><button>Outils</button><div class="drop"></div></div>
    <div class="menu" data-m="help"><button>Aide</button><div class="drop"></div></div>
    <span class="sp"></span>
    <button class="tgl" id="themeBtn" title="Thème clair / sombre">Thème</button>
  </div>
  <div id="toolbar">
    <button id="tbOpen">Ouvrir</button><button id="tbSave" class="primary">Enregistrer</button>
    <span class="vsep"></span>
    <button id="tbUndo">Annuler</button><button id="tbRedo">Rétablir</button>
    <span class="vsep"></span>
    <button id="tbZoomOut">−</button><span id="zoomLbl" style="min-width:46px;text-align:center;font-family:var(--mono)">100%</span><button id="tbZoomIn">+</button><button id="tbFit">Ajuster</button><button id="tbActual">1:1</button>
    <span class="vsep"></span>
    <label>Taille <input type="range" id="brushSize" min="1" max="200" value="12"><span id="brushSizeV" style="font-family:var(--mono);min-width:24px">12</span></label>
    <label>Opacité <input type="range" id="brushOp" min="1" max="100" value="100"><span id="brushOpV" style="font-family:var(--mono);min-width:30px">100</span></label>
    <label>Dureté <input type="range" id="brushHard" min="0" max="100" value="60"></label>
    <label>Tolérance <input type="range" id="tol" min="0" max="255" value="32"><span id="tolV" style="font-family:var(--mono);min-width:26px">32</span></label>
    <label>Forme <select id="brushShape"><option value="round">Rond</option><option value="square">Carré</option><option value="slash">Oblique</option></select></label>
    <span class="vsep"></span>
    <label>Sélection <select id="selRatio"><option value="free">Libre</option><option value="1:1">1:1</option><option value="4:3">4:3</option><option value="3:2">3:2</option><option value="16:9">16:9</option><option value="3:4">3:4</option><option value="9:16">9:16</option><option value="fixed">Taille fixe</option></select></label>
    <span id="fixBox" style="display:none"><input type="number" id="fixW" value="300" min="1"> × <input type="number" id="fixH" value="200" min="1"> px</span>
    <label>Dégradé <select id="gradKind"><option value="lin">Linéaire</option><option value="rad">Radial</option><option value="ref">Réfléchi</option></select></label>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="stage">
      <div id="wrap"><canvas id="cv" width="1" height="1"></canvas><canvas id="ov"></canvas><textarea id="textbox" spellcheck="false"></textarea></div>
      <div id="empty"><div><b>Déposez une image ici</b>Fichier / Ouvrir, ou glissez-déposez une ou plusieurs images (JPG, PNG, GIF, WebP, BMP). Vous pouvez aussi créer une image vide (Ctrl+N) ou coller depuis le presse-papiers (Ctrl+V).<br><br><button id="emptyOpen" class="primary">Ouvrir une image</button> <button id="emptyDemo">Image d'essai</button></div></div>
    </div>
  </div>
  <div id="status"><span id="stPos">x: – y: –</span><span id="stSize">–</span><span id="stSel">Aucune sélection</span><span id="stColor">–</span><span id="stName"></span></div>
</div>
<div id="modal"><div id="dlg"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="maskIn" accept="image/*" hidden>
<input type="file" id="selIn" accept="image/*" hidden>
<input type="file" id="batchIn" accept="image/*" multiple hidden>

<script>
/* ===== Core ===== */
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),ov=$('#ov'),octx=ov.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const st={docs:[],cur:-1,zoom:1,tool:'rect',hist:[],redo:[],sel:null,float:null,name:'',dirty:false,clip:null,pending:null};
let storeOK=true; try{localStorage.getItem('x')}catch(e){storeOK=false}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function hasImg(){return st.cur>=0}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}

/* ===== Documents ===== */
function snapshotDoc(){if(st.cur<0)return;const d=st.docs[st.cur];d.snap=ctx.getImageData(0,0,cv.width,cv.height);d.hist=st.hist;d.redo=st.redo;d.sel=st.sel;d.zoom=st.zoom;d.dirty=st.dirty}
function loadDoc(i){
  st.cur=i;const d=st.docs[i];
  cv.width=d.snap.width;cv.height=d.snap.height;ctx.putImageData(d.snap,0,0);
  st.hist=d.hist;st.redo=d.redo;st.sel=d.sel;st.zoom=d.zoom||1;st.name=d.name;st.dirty=d.dirty;st.float=null;
  $('#empty').style.display='none';applyZoom();updateStatus();
}
function addDoc(canvasOrData,name){
  snapshotDoc();
  let id;
  if(canvasOrData instanceof ImageData)id=canvasOrData;
  else id=canvasOrData.getContext('2d').getImageData(0,0,canvasOrData.width,canvasOrData.height);
  st.docs.push({snap:id,hist:[],redo:[],sel:null,zoom:1,name:name||'Sans titre',dirty:false});
  loadDoc(st.docs.length-1);fitZoom(true);
}
function switchDoc(delta){if(st.docs.length<2)return;snapshotDoc();loadDoc((st.cur+delta+st.docs.length)%st.docs.length);fitZoom(true);toast(st.name+'  ('+(st.cur+1)+'/'+st.docs.length+')')}
function closeDoc(){
  if(!hasImg())return;st.docs.splice(st.cur,1);
  if(!st.docs.length){st.cur=-1;cv.width=1;cv.height=1;ctx.clearRect(0,0,1,1);st.hist=[];st.redo=[];st.sel=null;$('#empty').style.display='grid';applyZoom();updateStatus();return}
  loadDoc(Math.min(st.cur,st.docs.length-1));fitZoom(true);
}
function loadFiles(files){
  const arr=[...files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name));
  if(!arr.length){toast('Aucune image reconnue');return}
  arr.forEach(f=>{
    const url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const c=mk(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);addDoc(c,f.name.replace(/\.[^.]+$/,''))};
    im.onerror=()=>toast('Impossible de lire '+f.name);im.src=url;
  });
}
function newImage(w,h,bg){const c=mk(w,h),x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}addDoc(c,'Sans titre')}
function demoImage(){
  const w=900,h=600,c=mk(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1e3c72');g.addColorStop(.55,'#f2994a');g.addColorStop(1,'#f2c94c');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#fff3c4';x.beginPath();x.arc(640,330,70,0,7);x.fill();
  x.fillStyle='#1b2a3a';x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=30)x.lineTo(i,400+Math.sin(i/90)*40+Math.sin(i/37)*18);x.lineTo(w,h);x.fill();
  x.fillStyle='#0d1823';x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=30)x.lineTo(i,500+Math.sin(i/60+2)*30);x.lineTo(w,h);x.fill();
  x.fillStyle='rgba(255,255,255,.85)';x.font='600 34px "IBM Plex Sans",sans-serif';x.fillText('Image d’essai',40,70);
  addDoc(c,'essai');
}

/* ===== History ===== */
function pushHist(before){
  st.hist.push(before);if(st.hist.length>30)st.hist.shift();st.redo=[];st.dirty=true;updateStatus();
}
function restore(id){if(cv.width!==id.width||cv.height!==id.height){cv.width=id.width;cv.height=id.height}ctx.putImageData(id,0,0)}
function undo(){
  if(st.float){cancelFloat();return}
  if(!st.hist.length)return;const cur=ctx.getImageData(0,0,cv.width,cv.height);
  st.redo.push(cur);const b=st.hist.pop();if(b.width!==cv.width||b.height!==cv.height)st.sel=null;restore(b);applyZoom();updateStatus();
}
function redo(){
  if(!st.redo.length)return;const cur=ctx.getImageData(0,0,cv.width,cv.height);
  st.hist.push(cur);const b=st.redo.pop();if(b.width!==cv.width||b.height!==cv.height)st.sel=null;restore(b);applyZoom();updateStatus();
}
function revert(){if(st.hist.length){const first=st.hist[0];pushHist(ctx.getImageData(0,0,cv.width,cv.height));restore(first)}}

/* ===== Selection ===== */
function maskData(){return st.sel?st.sel.mask.getContext('2d').getImageData(0,0,cv.width,cv.height).data:null}
function setSelection(mask,path){
  const m=mask.getContext('2d').getImageData(0,0,mask.width,mask.height).data;
  let x0=1e9,y0=1e9,x1=-1,y1=-1;const w=mask.width,h=mask.height;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[(y*w+x)*4+3]>127){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0){st.sel=null;redrawOverlay();updateStatus();return}
  st.sel={mask,path:path||null,bbox:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1},edge:null};
  if(!path)st.sel.edge=buildEdge(m,w,h);
  redrawOverlay();updateStatus();
}
function buildEdge(m,w,h){
  const c=mk(w,h),x=c.getContext('2d'),id=x.createImageData(w,h),d=id.data;
  const on=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&m[(j*w+i)*4+3]>127;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){
    if(!on(i,y))continue;
    if(!on(i-1,y)||!on(i+1,y)||!on(i,y-1)||!on(i,y+1)){const p=(y*w+i)*4,b=((i+y)>>2)&1?255:0;d[p]=d[p+1]=d[p+2]=b;d[p+3]=255}
  }
  x.putImageData(id,0,0);return c;
}

  if(!st.sel)return after;
  const m=maskData(),b=before.data,a=after.data;

  for(let i=0;i<a.length;i+=4){

    a[i]=b[i]+(a[i]-b[i])*k;a[i+1]=b[i+1]+(a[i+1]-b[i+1])*k;a[i+2]=b[i+2]+(a[i+2]-b[i+2])*k;a[i+3]=b[i+3]+(a[i+3]-b[i+3])*k;

/* ===== Painting ===== */
function finishDirect(before){
  const after=ctx.getImageData(0,0,cv.width,cv.height);
  const res=composeSel(before,after);ctx.putImageData(res,0,0);pushHist(before);
}
function dab(c,x,y,size,color,hard,shape,alpha){
  c.save();c.globalAlpha=alpha;
  if(shape==='square'){c.fillStyle=color;c.fillRect(x-size/2,y-size/2,size,size)}
  else if(shape==='slash'){c.strokeStyle=color;c.lineWidth=Math.max(1,size/6);c.lineCap='round';c.beginPath();c.moveTo(x-size/2,y+size/2);c.lineTo(x+size/2,y-size/2);c.stroke()}
  else{
    const r=Math.max(.5,size/2);
    if(hard>=95||r<2){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
    else{const [R,G,B]=hex2rgb(color),g=c.createRadialGradient(x,y,r*hard/100,x,y,r);
      g.addColorStop(0,`rgba(${R},${G},${B},1)`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
  }
  c.restore();
}
function startStroke(x,y,tool,e){
  const before=ctx.getImageData(0,0,cv.width,cv.height);
  const col=(e.button===2)?$('#c2').value:$('#c1').value;
  stroke={tool,before,col,last:[x,y],alpha:$('#brushOp').value/100,layer:null,patch:null};
  if(tool==='brush'){stroke.layer=mk(cv.width,cv.height)}
  if(tool==='clone'){stroke.off=[cloneSrc[0]-x,cloneSrc[1]-y];stroke.src=mk(cv.width,cv.height);stroke.src.getContext('2d').putImageData(before,0,0)}
  if(tool==='finger'){const s=Math.max(4,$('#brushSize').value*1);stroke.patch=mk(s,s);stroke.patch.getContext('2d').drawImage(cv,x-s/2,y-s/2,s,s,0,0,s,s)}
  drag={type:'stroke'};
  stampAt(x,y);
  if(tool==='air'){clearInterval(airTimer);airTimer=setInterval(()=>{if(stroke)stampAt(stroke.last[0],stroke.last[1])},35)}
  redrawOverlay();
}
function moveStroke(x,y){
  const s=stroke,sz=$('#brushSize').value*1,step=Math.max(1,sz*.18);
  const dx=x-s.last[0],dy=y-s.last[1],d=Math.hypot(dx,dy);
  if(s.tool==='air'){s.last=[x,y];return}
  const n=Math.max(1,Math.floor(d/step));
  for(let i=1;i<=n;i++)stampAt(s.last[0]+dx*i/n,s.last[1]+dy*i/n);
  s.last=[x,y];redrawOverlay();
}
function stampAt(x,y){
  const s=stroke,sz=$('#brushSize').value*1,hard=$('#brushHard').value*1,shape=$('#brushShape').value,tool=s.tool;
  s.last=[x,y];
  if(tool==='brush'){dab(s.layer.getContext('2d'),x,y,sz,s.col,hard,shape,1)}
  else if(tool==='erase'){
    ctx.save();ctx.globalCompositeOperation='destination-out';
    const r=Math.max(.5,sz/2),g=ctx.createRadialGradient(x,y,r*hard/100,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+s.alpha+')');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;if(shape==='square'){ctx.globalAlpha=s.alpha;ctx.fillStyle='#000';ctx.fillRect(x-sz/2,y-sz/2,sz,sz)}else{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }
  else if(tool==='air'){
    const r=sz/2,cnt=Math.max(4,Math.round(sz*.6));ctx.save();ctx.fillStyle=s.col;ctx.globalAlpha=s.alpha*.35;
    for(let i=0;i<cnt;i++){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r;ctx.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,1.2,1.2)}ctx.restore();
  }
  else if(tool==='blur'){blurDab(x,y,sz,s.alpha)}

    const p=s.patch,w=p.width;ctx.save();ctx.beginPath();ctx.arc(x,y,w/2,0,Math.PI*2);ctx.clip();ctx.globalAlpha=Math.min(.9,s.alpha*.7);ctx.drawImage(p,x-w/2,y-w/2);ctx.restore();
    p.getContext('2d').clearRect(0,0,w,w);p.getContext('2d').drawImage(cv,x-w/2,y-w/2,w,w,0,0,w,w);
  }
  else if(tool==='clone'){
    const sx=x+s.off[0],sy=y+s.off[1],r=sz/2;ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.globalAlpha=s.alpha;

  }
}
function blurDab(cx,cy,sz,alpha){
  const r=Math.max(2,Math.round(sz/2)),x0=Math.max(0,Math.floor(cx-r)),y0=Math.max(0,Math.floor(cy-r)),x1=Math.min(cv.width,Math.ceil(cx+r)),y1=Math.min(cv.height,Math.ceil(cy+r));
  const w=x1-x0,h=y1-y0;if(w<2||h<2)return;
  const id=ctx.getImageData(x0,y0,w,h),s=id.data,o=new Uint8ClampedArray(s);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dd=Math.hypot(x0+x-cx,y0+y-cy);if(dd>r)continue;
    const k=(1-dd/r)*alpha;let R=0,G=0,B=0,A=0,n=0;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=x+i,yy=y+j;if(xx<0||yy<0||xx>=w||yy>=h)continue;const p=(yy*w+xx)*4;R+=o[p];G+=o[p+1];B+=o[p+2];A+=o[p+3];n++}
    const p=(y*w+x)*4;s[p]=o[p]+(R/n-o[p])*k;s[p+1]=o[p+1]+(G/n-o[p+1])*k;s[p+2]=o[p+2]+(B/n-o[p+2])*k;s[p+3]=o[p+3]+(A/n-o[p+3])*k;
  }

}
function endStroke(){
  clearInterval(airTimer);const s=stroke;stroke=null;if(!s)return;
  if(s.layer){ctx.save();ctx.globalAlpha=s.alpha;ctx.drawImage(s.layer,0,0);ctx.restore()}
  finishDirect(s.before);
}

/* ===== Pipette / fill / wand ===== */
function pick(x,y,second){
  if(x<0||y<0||x>=cv.width||y>=cv.height)return;
  const p=ctx.getImageData(x,y,1,1).data;(second?$('#c2'):$('#c1')).value=rgb2hex(p[0],p[1],p[2]);
}
function floodRegion(id,sx,sy,tol){
  const w=id.width,h=id.height,d=id.data,vis=new Uint8Array(w*h),o=(sy*w+sx)*4,r0=d[o],g0=d[o+1],b0=d[o+2],a0=d[o+3];
  const stack=[sx,sy];
  const ok=i=>{const p=i*4;return Math.abs(d[p]-r0)<=tol&&Math.abs(d[p+1]-g0)<=tol&&Math.abs(d[p+2]-b0)<=tol&&Math.abs(d[p+3]-a0)<=tol};
  while(stack.length){
    let y=stack.pop(),x=stack.pop();
    let xl=x;while(xl>=0&&!vis[y*w+xl]&&ok(y*w+xl))xl--;xl++;
    let up=false,dn=false;
    for(let i=xl;i<w&&!vis[y*w+i]&&ok(y*w+i);i++){
      vis[y*w+i]=1;
      if(y>0){const k=(y-1)*w+i,m=!vis[k]&&ok(k);if(m&&!up){stack.push(i,y-1);up=true}else if(!m)up=false}
      if(y<h-1){const k=(y+1)*w+i,m=!vis[k]&&ok(k);if(m&&!dn){stack.push(i,y+1);dn=true}else if(!m)dn=false}
    }
  }
  return vis;
}
function magicWand(x,y){
  if(x<0||y<0||x>=cv.width||y>=cv.height)return;
  const id=ctx.getImageData(0,0,cv.width,cv.height),vis=floodRegion(id,x,y,$('#tol').value*1);
  const mask=mk(cv.width,cv.height),mx=mask.getContext('2d'),md=mx.createImageData(cv.width,cv.height);
  for(let i=0;i<vis.length;i++)if(vis[i]){md.data[i*4]=md.data[i*4+1]=md.data[i*4+2]=255;md.data[i*4+3]=255}
  mx.putImageData(md,0,0);setSelection(mask,null);
}
function floodFill(x,y,color){
  if(x<0||y<0||x>=cv.width||y>=cv.height)return;
  const [R,G,B]=hex2rgb(color),op=$('#brushOp').value/100,tol=$('#tol').value*1;
  applyOp(id=>{
    const vis=floodRegion(id,x,y,tol),d=id.data;
    for(let i=0;i<vis.length;i++)if(vis[i]){const p=i*4;d[p]+=(R-d[p])*op;d[p+1]+=(G-d[p+1])*op;d[p+2]+=(B-d[p+2])*op;d[p+3]+=(255-d[p+3])*op}
    return id;
  });
}

/* ===== Clipboard ===== */

async function doCopy(cut){

    applyOp(id=>{const d=id.data;if(!st.sel){d.fill(0);return id}
      const m=maskData();for(let i=0;i<d.length;i+=4){const k=m[i+3]/255;d[i+3]*=1-k}return id},true);
  }
  toast(cut?'Coupé':'Copié');
}
function doPaste(asNew){

  if(asNew||!hasImg()){addDoc(st.clip,'Collage');return}
  const stg=$('#stage'),r=cv.getBoundingClientRect(),sr=stg.getBoundingClientRect();
  const vx=Math.max(0,(sr.left-r.left)/st.zoom),vy=Math.max(0,(sr.top-r.top)/st.zoom);

document.addEventListener('paste',e=>{

  for(const it of items)if(it.type.startsWith('image/')){
    const f=it.getAsFile(),url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const c=mk(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);st.clip=c;doPaste(!hasImg())};im.src=url;e.preventDefault();return;

/* ===== Pixel filters ===== */
const F={

  emboss:id=>F.conv(F.gray(id),[-2,-1,0,-1,1,1,0,1,2],1,128),
  edges:id=>{const w=id.width,h=id.height,s=id.data,o=new Uint8ClampedArray(s),g=i=>.299*o[i]+.587*o[i+1]+.114*o[i+2];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const P=(i,j)=>g((clamp(y+j,0,h-1)*w+clamp(x+i,0,w-1))*4);
      const gx=-P(-1,-1)-2*P(-1,0)-P(-1,1)+P(1,-1)+2*P(1,0)+P(1,1),gy=-P(-1,-1)-2*P(0,-1)-P(1,-1)+P(-1,1)+2*P(0,1)+P(1,1);
      const v=255-Math.min(255,Math.hypot(gx,gy));const q=(y*w+x)*4;s[q]=s[q+1]=s[q+2]=v}return id},
  median:id=>{const w=id.width,h=id.height,s=id.data,o=new Uint8ClampedArray(s);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)for(let c=0;c<3;c++){const a=[];for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)a.push(o[(clamp(y+j,0,h-1)*w+clamp(x+i,0,w-1))*4+c]);a.sort((u,v)=>u-v);s[(y*w+x)*4+c]=a[4]}return id},
  vignette:(id,p)=>{const w=id.width,h=id.height,d=id.data,cx=w/2,cy=h/2,mr=Math.hypot(cx,cy);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=Math.hypot(x-cx,y-cy)/mr,k=1-p.v/100*Math.pow(t,2.2);const q=(y*w+x)*4;d[q]*=k;d[q+1]*=k;d[q+2]*=k}return id},

};

function replaceCanvas(c){
  const before=ctx.getImageData(0,0,cv.width,cv.height);pushHist(before);
  cv.width=c.width;cv.height=c.height;ctx.drawImage(c,0,0);st.sel=null;applyZoom();updateStatus();
}
function transformCanvas(kind,deg){
  if(!hasImg())return;commitFloat();
  const w=cv.width,h=cv.height;let c;
  if(kind==='r90'||kind==='l90'){c=mk(h,w);const x=c.getContext('2d');x.translate(h/2,w/2);x.rotate((kind==='r90'?1:-1)*Math.PI/2);x.drawImage(cv,-w/2,-h/2)}
  else if(kind==='r180'){c=mk(w,h);const x=c.getContext('2d');x.translate(w/2,h/2);x.rotate(Math.PI);x.drawImage(cv,-w/2,-h/2)}
  else if(kind==='fh'){c=mk(w,h);const x=c.getContext('2d');x.translate(w,0);x.scale(-1,1);x.drawImage(cv,0,0)}
  else if(kind==='fv'){c=mk(w,h);const x=c.getContext('2d');x.translate(0,h);x.scale(1,-1);x.drawImage(cv,0,0)}
  else if(kind==='free'){const a=deg*Math.PI/180,s=Math.abs(Math.sin(a)),co=Math.abs(Math.cos(a)),nw=Math.ceil(w*co+h*s),nh=Math.ceil(w*s+h*co);
    c=mk(nw,nh);const x=c.getContext('2d');x.translate(nw/2,nh/2);x.rotate(a);x.drawImage(cv,-w/2,-h/2)}
  replaceCanvas(c);fitZoom(true);
}

  if(!hasImg())return;
  const pv=previewOp((id,p)=>{
    const d=id.data,w=id.width,h=id.height,[R,G,B]=hex2rgb(p.col),lim=p.tol*1.28;
    const m=k=>{const a=d[k*4]-R,b=d[k*4+1]-G,c=d[k*4+2]-B;return Math.sqrt((a*a+b*b+c*c)/3)<=lim};
    if(!p.edge){for(let k=0;k<w*h;k++)if(m(k))d[k*4+3]=0;return id}
    const seen=new Uint8Array(w*h),q=[],push=(x,y)=>{const k=y*w+x;if(!seen[k]&&m(k)){seen[k]=1;q.push(k)}};
    for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
    while(q.length){const k=q.pop(),x=k%w,y=(k/w)|0;d[k*4+3]=0;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}

function renderText(o){
  const m=mk(10,10).getContext('2d'),font=`${o.italic?'italic ':''}${o.bold?'700 ':'400 '}${o.size}px ${o.font}`;m.font=font;
  const lines=o.text.split('\n'),lh=Math.round(o.size*1.2);let tw=0;lines.forEach(l=>tw=Math.max(tw,m.measureText(l).width));
  const pad=Math.ceil(o.size*.25+o.ow+(o.shadow?o.size*.2:0)+2),w=Math.ceil(tw)+pad*2,h=lh*lines.length+pad*2;
  let c=mk(w,h),x=c.getContext('2d');x.font=font;x.textBaseline='top';
  if(o.shadow){x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=o.size*.12;x.shadowOffsetX=x.shadowOffsetY=o.size*.07}
  lines.forEach((l,i)=>{
    if(o.ow>0){x.lineWidth=o.ow*2;x.lineJoin='round';x.strokeStyle=o.oc;x.strokeText(l,pad,pad+i*lh)}
    x.fillStyle=o.color;x.fillText(l,pad,pad+i*lh)});
  if(o.rot){const a=o.rot*Math.PI/180,s=Math.abs(Math.sin(a)),co=Math.abs(Math.cos(a)),nw=Math.ceil(w*co+h*s),nh=Math.ceil(w*s+h*co),r=mk(nw,nh),rx=r.getContext('2d');
    rx.translate(nw/2,nh/2);rx.rotate(a);rx.drawImage(c,-w/2,-h/2);c=r}
  return c;
}

function noiseField(w,h,cell,seed){ // smooth value noise 0..1
  const gw=Math.ceil(w/cell)+2,gh=Math.ceil(h/cell)+2,g=new Float32Array(gw*gh);let s=seed*9301+49297;
  for(let i=0;i<g.length;i++){s=(s*9301+49297)%233280;g[i]=s/233280}
  const o=new Float32Array(w*h);

function batchProcess(im,o){

  let id=x.getImageData(0,0,w,h);

  inp.click();
}

function buildMenus(){
  document.querySelectorAll('.menu').forEach(m=>{
    const b=m.querySelector('button'),dr=m.querySelector('.drop');
    b.onclick=e=>{e.stopPropagation();const was=m.classList.contains('open');closeMenus();if(!was)openMenu(m)};
    b.onmouseenter=()=>{if(document.querySelector('.menu.open')&&!m.classList.contains('open')){closeMenus();openMenu(m)}};
  });
}
function openMenu(m){
  const dr=m.querySelector('.drop');dr.innerHTML='';
  MENUS[m.dataset.m].forEach(it=>{
    if(it===SEP){dr.appendChild(document.createElement('hr'));return}
    const b=document.createElement('button');b.innerHTML='<span></span><kbd></kbd>';b.firstChild.textContent=it[0];b.lastChild.textContent=it[1]||'';
    if(it[3]&&!it[3]())b.disabled=true;b.onclick=()=>{closeMenus();it[2]()};dr.appendChild(b);
  });
  m.classList.add('open');const r=m.getBoundingClientRect();dr.style.left=Math.min(r.left,innerWidth-250)+'px';dr.style.top=r.bottom+'px';
}
function closeMenus(){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'))}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))closeMenus()});

function newDialog(){

    [{label:'Annuler',fn:closeDlg},{label:'Créer',primary:true,fn:()=>{const b=$('#nb').value,col=b==='bg'?$('#c2').value:b==='fg'?$('#c1').value:b==='w'?'#ffffff':null;
      const w=clamp(parseInt($('#nw').value)||1024,1,8000),h=clamp(parseInt($('#nh').value)||768,1,8000);closeDlg();newImage(w,h,col)}}]);
}

function helpDialog(){
  openDlg('Aide rapide',`<p style="color:var(--fg)"><b>Ouvrir.</b> Glissez une image dans la fenêtre ou utilisez Fichier / Ouvrir. Plusieurs images peuvent être ouvertes ; PgUp et PgDn passent de l’une à l’autre.</p>
  <p style="color:var(--fg)"><b>Sélections.</b> Les filtres et réglages ne s’appliquent qu’à la zone sélectionnée. Sans sélection, ils agissent sur toute l’image. Le lasso trace à main levée, le polygone se ferme par un double-clic.</p>
  <p style="color:var(--fg)"><b>Retouche.</b> Si l’image est trop sombre ou trop claire, corrigez d’abord le gamma, puis affinez la luminosité et le contraste.</p>
  <p style="color:var(--fg)"><b>PhotoMasque.</b> Un masque est une image en niveaux de gris : le blanc laisse l’image intacte, le noir applique l’effet à fond. Essayez deux masques à la suite avec des couleurs différentes.</p>
  <p style="color:var(--fg)"><b>Transparence.</b> Enregistrez en PNG ou WebP pour la conserver. Le JPEG la remplace par un fond uni.</p>
  <p style="color:var(--fg)"><b>Lot.</b> Outils / Automatisation traite plusieurs images d’un coup et rend un fichier ZIP.</p>`,[{label:'Fermer',primary:true,fn:closeDlg}]);
}

/* ===== Keyboard ===== */
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(dlgOpen()){if(e.key==='Escape')closeDlg();return}
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod){
    const map={n:newDialog,o:()=>$('#fileIn').click(),s:saveDialog,z:undo,y:redo,c:()=>doCopy(false),x:()=>doCopy(true),a:selectAll,i:selectInvert,t:()=>openTextDialog(),b:fillStrokeDialog,u:()=>hasImg()&&addDoc(cv,st.name+' (copie)'),w:closeDoc,j:propsDialog,r:revert,
      k:()=>st.lastFilter&&st.lastFilter(),h:e.shiftKey?cropToSelection:resizeDialog,d:()=>{const a=$('#app');a.dataset.hideSel=a.dataset.hideSel==='1'?'0':'1';redrawOverlay()}};
    if(k==='v'){if(e.shiftKey){e.preventDefault();doPaste(true)}return}
    if(map[k]){e.preventDefault();map[k]()}return;
  }
  if(e.shiftKey&&k==='h'){e.preventDefault();canvasSizeDialog();return}
  if(k==='enter'){if(st.float)commitFloat();else if(st.pending&&st.pending.type==='poly'&&st.pending.pts.length>2)finishPoly();return}
  if(k==='escape'){if(st.float)cancelFloat();else if(st.pending){st.pending=null;redrawOverlay()}else selectNone();return}
  if(k==='delete'||k==='backspace'){if(hasImg()){e.preventDefault();MENUS.edit.find(i=>i[0]&&i[0].startsWith('Effacer'))[2]()}return}
  if(k==='pageup'){e.preventDefault();switchDoc(-1);return}if(k==='pagedown'){e.preventDefault();switchDoc(1);return}
  if(k==='+'||k==='='){setZoom(st.zoom*1.25);return}if(k==='-'){setZoom(st.zoom/1.25);return}if(k==='0'){fitZoom(false);return}if(k==='1'){setZoom(1);return}
  if(st.float&&k.startsWith('arrow')){e.preventDefault();const s=e.shiftKey?8:1;if(k==='arrowleft')st.float.x-=s;if(k==='arrowright')st.float.x+=s;if(k==='arrowup')st.float.y-=s;if(k==='arrowdown')st.float.y+=s;redrawOverlay();return}
  if(KEYTOOL[k])setTool(KEYTOOL[k]);
});
